[project]
name = "stripe-shop"
version = "0.1.0"
description = "Django + Stripe test task: items, orders, discounts and taxes paid through Stripe Checkout and Payment Intents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.18",
    "django-environ>=0.14",
    "stripe>=15.4,<16",
    "gunicorn>=26.0",
    "whitenoise>=6.12",
    "psycopg[binary]>=3.2",
]

# An application, not an installable package - `uv sync` only manages the deps.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.13",
    "factory-boy>=3.3",
    "ruff>=0.14",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
]

[tool.ruff.lint.isort]
known-first-party = ["config", "shop"]

# mypy with the django-stubs plugin understands the ORM (descriptors, managers,
# nullable FKs), which generic checkers cannot see through yet.
[tool.mypy]
python_version = "3.12"
files = ["config", "shop", "manage.py"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Libraries without type stubs.
module = ["environ.*", "factory.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"
