{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Магазин Stripe{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'web:index' %}">Магазин&nbsp;Stripe</a>
    <nav class="topbar__nav">
      <span class="badge badge--test">Тестовый режим Stripe</span>
      <a href="{% url 'admin:index' %}">Админка</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Тестовое задание Django&nbsp;+&nbsp;Stripe &middot; тестовая карта <code>4242 4242 4242 4242</code>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
